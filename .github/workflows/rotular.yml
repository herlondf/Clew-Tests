# Etiqueta as issues que o clew abre, a partir do que ele escreve no corpo.
# O rastreador aplica uma lista fixa de labels; projeto, tipo e natureza do erro
# saem do índice e da mensagem. Rode à mão (numero) para refazer uma issue antiga.
name: Rotular issue do clew
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      numero:
        description: Número da issue
        required: true
permissions:
  issues: write
jobs:
  rotular:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number || inputs.numero }}
        run: |
          corpo=$(gh issue view "$N" -R "$GITHUB_REPOSITORY" --json title,body --jq '.title + "\n" + .body')
          printf '%s' "$corpo" | grep -q 'Reportado pelo clew' || exit 0

          # Só título, mensagem e origem. A análise da IA fala em "conexão" e
          # "tente novamente" ao explicar, e rotular por ela troca a natureza do erro.
          t=$(printf '%s\n' "$corpo" | awk 'NR==1 || /\*\*(Mensagem|Origem):\*\*/' | tr 'A-Z' 'a-z')
          m() { printf '%s' "$t" | grep -Eq "$1"; }

          l=clew
          for p in nfe nfce nfse brasil mde reinf engine auth; do m "[_-]$p[_-]" && l="$l $p"; done
          m '[_-]nfse[_-]' && m 'nacional|sped\.fazenda\.gov\.br/nfse|sefin' && l="$l nfse-nacional"
          # O engine é worker (dataInicio e erro booleano), mesmo sem "worker" no nome.
          if m 'worker|[_-]engine[_-]'; then l="$l worker"; else l="$l api"; fi
          if m 'timeout|timed out|tempo esgotado|\b50[234]\b|indispon|connection|conex|socket|refused|bloqueado temporariamente|tente novamente|n.o foi obtido resposta'; then
            l="$l instabilidade"; else l="$l bug"; fi
          printf '%s' "$corpo" | grep -q 'O que a IA leu' && l="$l analisado-por-ia"

          # Substitui, e não soma: refazer uma issue antiga tira o rótulo errado.
          args=(); for x in $l; do args+=(-f "labels[]=$x"); done
          gh api -X PUT "repos/$GITHUB_REPOSITORY/issues/$N/labels" "${args[@]}" --jq '[.[].name] | join(",")'
